<template id="tt-easy-access-logs-drawer-template">
    <div id="tt-easy-access-logs-drawer" class="drawer tt-eal-drawer">
        <div
            class="drawer-toggle drawer-header tt-eal-drawer-toggle"
            title="Developer & API Logs"
            role="button"
            tabindex="0"
            aria-label="Developer & API Logs"
            aria-expanded="false"
            aria-controls="tt-easy-access-logs-panel"
        >
            <div class="drawer-icon fa-solid fa-file-waveform fa-fw closedIcon tt-eal-drawer-icon"></div>
        </div>
        <div id="tt-easy-access-logs-panel" class="drawer-content closedDrawer tt-eal-drawer-panel tt-eal-menu-dropdown">
            <div class="tt-eal-menu-inner">
                <button class="tt-eal-menu-item" type="button" data-tt-eal-panel="llm" title="LLM API Logs (F10)" aria-keyshortcuts="F10">
                    <i class="fa-solid fa-receipt fa-fw" aria-hidden="true"></i>
                    <span>LLM API Logs</span>
                    <span class="tt-eal-item-shortcut">F10</span>
                </button>
                <button class="tt-eal-menu-item" type="button" data-tt-eal-panel="frontend" title="Frontend Logs (Ctrl+F10)" aria-keyshortcuts="Control+F10">
                    <i class="fa-solid fa-desktop fa-fw" aria-hidden="true"></i>
                    <span>Frontend Logs</span>
                    <span class="tt-eal-item-shortcut">Ctrl+F10</span>
                </button>
                <button class="tt-eal-menu-item" type="button" data-tt-eal-panel="backend" title="Backend Logs (Alt+F10)" aria-keyshortcuts="Alt+F10">
                    <i class="fa-solid fa-server fa-fw" aria-hidden="true"></i>
                    <span>Backend Logs</span>
                    <span class="tt-eal-item-shortcut">Alt+F10</span>
                </button>
            </div>
        </div>
    </div>
</template>
